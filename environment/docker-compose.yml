version: "3.8"

services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres-wal-divergence-main
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /var/log/postgresql:/var/log/postgresql
    tmpfs:
      - /tmp
    privileged: false
    restart: "no"

volumes:
  pgdata:
